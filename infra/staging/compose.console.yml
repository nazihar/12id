# Console stack (Phase 4 C5): console-migrate (init job) + console (TanStack Start + Better Auth).
#
#   EXTRA_SECRETS="agent" infra/scripts/deploy.sh console up -d --build
#
# secrets/console.sops.env: BETTER_AUTH_SECRET, CONSOLE_TOKEN (must equal platform.sops.env's
# CONSOLE_TOKEN), SMTP_URL (required: email OTP, invitations, password links), optional MAIL_FROM.
# EXTRA_SECRETS adds AGENT_POSTGRES_PASSWORD: the `console` database lives on agent-postgres.
#
# Network: `12id-agent` only, for agent-postgres and platform-api (http://platform-api:3500, the
# console scope). Published on 127.0.0.1; Caddy serves it as 12id.naziharitsolution.com.
name: console

# phase6: biometric settings, face-check policies and the biometric log in the exchanges list.
x-image: &image 12id/console:phase6

x-console-env: &console-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:${AGENT_POSTGRES_PASSWORD:?run with EXTRA_SECRETS="agent"}@agent-postgres:5432/console
  BETTER_AUTH_URL: https://12id.naziharitsolution.com
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?decrypt secrets via deploy.sh}
  PLATFORM_API_URL: http://platform-api:3500
  CONSOLE_TOKEN: ${CONSOLE_TOKEN:?decrypt secrets via deploy.sh}
  # Only the `console` service sends mail; the migration and CLI jobs run without SMTP_URL.
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-12id Console <no-reply@12id.naziharitsolution.com>}

services:
  # One-shot: creates the `console` database if missing and applies the Better Auth migrations.
  console-migrate:
    build:
      context: ../../console
      target: runtime
    image: *image
    command: ['node', 'scripts/migrate.ts']
    environment: *console-env
    mem_limit: 256m
    networks: [agent]

  console:
    image: *image
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 20s
    # Without SMTP_URL the console itself refuses to start ("SMTP_URL: required in production").
    environment: *console-env
    ports:
      - '127.0.0.1:3600:3600'
    networks: [agent]
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3600/api/health\").then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      console-migrate:
        condition: service_completed_successfully

  # Operator bootstrap and other Better Auth CLI work (profile `tools`, never started by `up`):
  #   EXTRA_SECRETS=agent deploy.sh console run --rm console-tools \
  #     npx auth create-admin --config src/server/auth.server.ts --email you@12id.example \
  #     --password '<temporary>' --name 'Your Name' --role operator --yes
  console-tools:
    build:
      context: ../../console
      target: build
    image: 12id/console:phase4-tools
    profiles: [tools]
    environment:
      <<: *console-env
      # The CLI only loads the auth config; NODE_ENV=production would demand SMTP_URL for it.
      NODE_ENV: development
    networks: [agent]

networks:
  agent:
    external: true
    name: 12id-agent
