global:
  smtp_smarthost: smtp.gmail.com:587
  smtp_from: onetwoidadmin@gmail.com
  smtp_auth_username: onetwoidadmin@gmail.com
  # Google app password, from GMAIL_APP_PASSWORD in secrets/monitoring.sops.env, written to
  # tmpfs by the container entrypoint. Until the owner adds it, alerts show in the UI only
  # and email delivery fails.
  smtp_auth_password_file: /run/smtp/password
  smtp_require_tls: true

route:
  receiver: email
  group_by: [alertname]
  group_wait: 1m
  group_interval: 10m
  repeat_interval: 12h

receivers:
  - name: email
    email_configs:
      - to: onetwoidadmin@gmail.com
        send_resolved: true
