global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: staging

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['127.0.0.1:9093']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['127.0.0.1:9101']

  - job_name: postgres
    static_configs:
      - targets: ['127.0.0.1:9187']

  - job_name: postgres-drizzle
    static_configs:
      - targets: ['127.0.0.1:9188']

  # Public HTTPS endpoints, through Caddy. Also feeds certificate-expiry alerts.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://genesis.12id.naziharitsolution.com/v1/pool_transactions_genesis
          - https://ledger.12id.naziharitsolution.com/
          # Answers 202, which http_2xx accepts.
          - https://mediator.12id.naziharitsolution.com/health
          - https://vdr.12id.naziharitsolution.com/genesis
          # Phase 2 agent-service readiness (503 while draining or when its database is down).
          - https://agent.12id.naziharitsolution.com/readyz
          - https://api.12id.naziharitsolution.com/v1/health
          # Phase 4 console liveness.
          - https://12id.naziharitsolution.com/api/health
    relabel_configs: &blackbox-relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Validator client ports on the public IP. Probed from the VM, so this hairpins through
  # the provider NAT: it proves the ports answer, not that every network can reach them.
  # Reachability is NOT consensus: writes failed with all four ports open (findings W1).
  - job_name: blackbox-indy-client
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 123.176.58.72:9702
          - 123.176.58.72:9704
          - 123.176.58.72:9706
          - 123.176.58.72:9708
    relabel_configs: *blackbox-relabel
