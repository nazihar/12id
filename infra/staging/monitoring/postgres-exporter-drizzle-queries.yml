# Custom postgres-exporter queries against the mediator's drizzle database.
# Table "DidcommMediation" comes from @credo-ts/drizzle-storage's didcomm bundle (image 375518d).

# mediator_mediations_records{state} and mediator_mediations_created_last_hour{state}.
# Mediation is open (4-init §2.3): anyone holding the invitation can register. A spike in
# new mediation records is the cheapest abuse signal until invitation gating exists.
mediator_mediations:
  query: |
    SELECT state::text AS state,
           count(*) AS records,
           count(*) FILTER (WHERE created_at > now() - interval '1 hour') AS created_last_hour
    FROM "DidcommMediation"
    GROUP BY state
  metrics:
    - state:
        usage: LABEL
        description: Mediation record state
    - records:
        usage: GAUGE
        description: Mediation records in this state
    - created_last_hour:
        usage: GAUGE
        description: Mediation records created in the last hour

# mediator_records{table}: growth of the records a wallet creates (Phase 7 review M4, M10, M16).
# Unused invitations are swept after 24 h and revoked wallets' mediations after their grace period,
# so steady growth here means the sweep stopped or something is minting invitations.
mediator_records:
  query: |
    SELECT 'DidcommOutOfBand' AS "table", count(*) AS records FROM "DidcommOutOfBand"
    UNION ALL SELECT 'DidcommMediation', count(*) FROM "DidcommMediation"
    UNION ALL SELECT 'DidcommConnection', count(*) FROM "DidcommConnection"
  metrics:
    - table:
        usage: LABEL
        description: Mediator storage table
    - records:
        usage: GAUGE
        description: Rows in this table
