# Biometric stack (Phase 6 B6, implement/16-phase-6-biometric.md): biometric-provision (init job) +
# biometric-service.
#
#   EXTRA_SECRETS="agent" infra/scripts/deploy.sh biometric
#
# secrets/biometric.sops.env: BIOMETRIC_MASTER_KEY (32 random bytes, base64), BIOMETRIC_INTERNAL_TOKEN
# (platform-api presents it; the same value goes into platform.sops.env), BIOMETRIC_AWS_ACCESS_KEY_ID /
# BIOMETRIC_AWS_SECRET_ACCESS_KEY (12id's own AWS principal, which assumes each tenant's role; see
# runbooks/biometric-service.md). EXTRA_SECRETS adds AGENT_POSTGRES_PASSWORD.
#
# Database: `biometric` on the agent stack's Postgres (owner decision, 16-phase-6-biometric.md), as
# `postgres` until review H3 gives it its own role. Backed up with the other agent databases.
#
# Networks: `12id-agent` for agent-postgres, `12id-biometric` (created here) shared with platform-api
# only. Nothing is published on the host; the service needs outbound HTTPS to AWS.
#
# Deploy this stack before the platform stack: platform-api joins 12id-biometric.
name: biometric

x-image: &image 12id/services:phase6

x-biometric-env: &biometric-env
  LOG_LEVEL: ${BIOMETRIC_LOG_LEVEL:-info}
  HOST: 0.0.0.0
  PORT: "3430"
  DATABASE_URL: postgresql://postgres:${AGENT_POSTGRES_PASSWORD:?run with EXTRA_SECRETS="agent"}@agent-postgres:5432/biometric
  BIOMETRIC_MASTER_KEY: ${BIOMETRIC_MASTER_KEY:?decrypt secrets via deploy.sh}
  INTERNAL_TOKEN: ${BIOMETRIC_INTERNAL_TOKEN:?decrypt secrets via deploy.sh}
  BIOMETRIC_AWS_ACCESS_KEY_ID: ${BIOMETRIC_AWS_ACCESS_KEY_ID:-}
  BIOMETRIC_AWS_SECRET_ACCESS_KEY: ${BIOMETRIC_AWS_SECRET_ACCESS_KEY:-}
  BIOMETRIC_AWS_REGION: ap-south-1
  # Staging only: smokes and the console spec use the mock provider. Never true in production.
  BIOMETRIC_ENABLE_MOCK: "true"

services:
  # One-shot: creates the biometric database on agent-postgres and applies migrations.
  biometric-provision:
    build: ../../services
    image: *image
    command: ['biometric-service/src/provision.ts']
    environment: *biometric-env
    mem_limit: 256m
    networks: [agent]

  biometric-service:
    image: *image
    command: ['biometric-service/src/main.ts']
    restart: unless-stopped
    mem_limit: 384m
    stop_grace_period: 20s
    environment: *biometric-env
    networks: [agent, biometric]
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3430/healthz\").then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      biometric-provision:
        condition: service_completed_successfully

networks:
  agent:
    external: true
    name: 12id-agent
  biometric:
    name: 12id-biometric
