# Edge stack: TLS termination for *.12id.naziharitsolution.com.
#
# Host networking so Caddy can reach services that are published on 127.0.0.1 only
# (Docker-published ports bypass ufw, so internal services must never bind 0.0.0.0).
# indy-vdr-proxy joins this stack in W10.
name: edge

services:
  caddy:
    # Caddy 2.11.4 plus caddy-ratelimit (W6); the Caddyfile does not load on stock caddy.
    build: ./caddy
    image: 12id/caddy-ratelimit:2.11.4
    network_mode: host
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./genesis:/srv/genesis:ro
      - caddy-data:/data
      - caddy-config:/config

  # W10 hedge: ledger reads over 443. Listens on localhost only; Caddy exposes GET/HEAD.
  vdr-proxy:
    build: ./vdr-proxy
    image: 12id/indy-vdr-proxy:v0.4.5
    network_mode: host
    restart: unless-stopped
    mem_limit: 128m
    command:
      - --genesis
      - /genesis/pool_transactions_genesis
      - --name
      - twelveid:staging
      - --host
      - 127.0.0.1
      - --port
      - "3100"
    volumes:
      # The published, immutable genesis version, not the ledger container's copy.
      - ./genesis/v1:/genesis:ro

volumes:
  caddy-data:
  caddy-config:
