# Ledger tooling (W3). von-network itself is run by its own `manage` script (see
# ledger/von-network.env); this file only holds one-off tools that act on it.
#
#   EXTRA_SECRETS=agent infra/scripts/deploy.sh ledger run --rm --build bootstrap-endorser
#
# secrets/ledger.sops.env gives ENDORSER_ASKAR_STORE_KEY; EXTRA_SECRETS=agent adds ENDORSER_DB_PASSWORD.
# Since Phase 7 H3 the endorser store is on agent-postgres, owned by `endorser_service`: run
# infra/scripts/pg-roles.sh agent first so the (empty) `endorser` database exists for Askar.
name: ledger

services:
  bootstrap-endorser:
    build: ../ledger
    image: 12id/ledger-tools:credo-0.7.0
    mem_limit: 512m
    environment:
      # Same signed, public genesis the SDK will use, not the ledger container's own copy.
      GENESIS_URL: https://genesis.12id.naziharitsolution.com/v1/pool_transactions_genesis
      GENESIS_SHA256: 6ab9bc1a3ba5ff257454ca8500a41d45756cd02c3db6c280bde51c7b363a835a
      # von-network's unauthenticated /register, reached on its Docker network only.
      LEDGER_REGISTER_URL: http://webserver:8000/register
      # did:indy namespace: must match [a-z][_a-z0-9-]*(:[a-z][_a-z0-9-]*)?, so "12id" is invalid.
      INDY_NAMESPACE: twelveid:staging
      ENDORSER_ALIAS: 12id-staging-endorser
      # Askar on Postgres: the store id is also the database name (created by pg-roles.sh).
      ASKAR_STORE_ID: endorser
      ASKAR_STORE_KEY: ${ENDORSER_ASKAR_STORE_KEY:?decrypt secrets via deploy.sh}
      POSTGRES_HOST: agent-postgres:5432
      POSTGRES_USER: endorser_service
      POSTGRES_PASSWORD: ${ENDORSER_DB_PASSWORD:?run with EXTRA_SECRETS=agent}
      LOG_LEVEL: info
    networks:
      - von
      - endorser

  # W8 smoke:credo (and W5 M1): issuer + Credo holder in one process. The holder has no
  # inbound transport and reaches the mediator through the public wss:// URL, so the whole
  # TLS edge is exercised.
  #
  #   MEDIATOR_INVITATION_URL=<from mediator logs> EXTRA_SECRETS=agent \
  #     infra/scripts/deploy.sh ledger run --rm smoke-credo
  #
  # (EXTRA_SECRETS is only needed because this file's other service interpolates secrets.)
  smoke-credo:
    image: 12id/ledger-tools:credo-0.7.0
    build: ../ledger
    # Host networking: the inbound transport listens on :3200 for Caddy (ufw blocks it
    # externally), and /register is reachable at 127.0.0.1:9000.
    network_mode: host
    mem_limit: 768m
    command: ['src/smoke/smoke-credo.ts']
    environment:
      GENESIS_URL: https://genesis.12id.naziharitsolution.com/v1/pool_transactions_genesis
      GENESIS_SHA256: 6ab9bc1a3ba5ff257454ca8500a41d45756cd02c3db6c280bde51c7b363a835a
      INDY_NAMESPACE: twelveid:staging
      LEDGER_REGISTER_URL: http://127.0.0.1:9000/register
      ISSUER_ENDPOINT: https://smoke-issuer.12id.naziharitsolution.com
      ISSUER_PORT: "3200"
      # Optional at interpolation so other tools in this file run without it; the smoke
      # script itself refuses to start when it is missing.
      MEDIATOR_INVITATION_URL: ${MEDIATOR_INVITATION_URL:-}
      # The Credo holder cannot use PickUpV1 against a ws-first mediator (Phase 0), so
      # this exercises the mediator with PickUpV2LiveMode; the native holder test uses PickUpV1.
      PICKUP_STRATEGY: ${PICKUP_STRATEGY:-PickUpV2LiveMode}
      # Holder outbound transports: "http", "ws" or "http,ws".
      HOLDER_OUTBOUND: ${HOLDER_OUTBOUND:-http,ws}
      LOG_LEVEL: ${LOG_LEVEL:-warn}

networks:
  von:
    external: true
    name: von_von
  endorser:
    external: true
    name: 12id-endorser
