# Platform stack (Phase 3 P9): platform-provision (init job) + platform-api.
#
#   EXTRA_SECRETS="agent mediator biometric" infra/scripts/deploy.sh platform
#
# secrets/platform.sops.env: PLATFORM_ADMIN_TOKEN, MEDIATOR_WEBHOOK_SECRET, MEDIATOR_ADMIN_TOKEN,
# PLATFORM_RO_PASSWORD (read-only role on the mediator's drizzle database, runbooks/platform-api.md),
# CONSOLE_TOKEN (Phase 4 console scope, runbooks/console.md).
# Phase 6: EXTRA_SECRETS "biometric" adds BIOMETRIC_INTERNAL_TOKEN; deploy the biometric stack first
# (platform-api joins its 12id-biometric network).
# EXTRA_SECRETS adds AGENT_POSTGRES_PASSWORD + AGENT_INTERNAL_TOKEN (agent stack) and nothing
# from the mediator file is needed beyond consistency (MEDIATOR_ADMIN_TOKEN must equal the
# mediator stack's ADMIN_API_TOKEN; keep both files in step).
#
# Networks: `12id-agent` for agent-service and agent-postgres (platform_api database lives on that
# instance), `12id-mediator` so the mediator can reach the webhook receiver as `platform-api` and
# the read-only drizzle query can reach `postgres`. Published on 127.0.0.1 only; Caddy proxies
# 3500 as api.<domain> and blocks /internal/* and /admin/*.
name: platform

x-image: &image 12id/services:phase6

x-platform-env: &platform-env
  LOG_LEVEL: ${PLATFORM_LOG_LEVEL:-info}
  HOST: 0.0.0.0
  PORT: "3500"
  PUBLIC_URL: https://api.12id.naziharitsolution.com
  DATABASE_URL: postgresql://postgres:${AGENT_POSTGRES_PASSWORD:?run with EXTRA_SECRETS="agent mediator"}@agent-postgres:5432/platform_api

  AGENT_API_URL: http://agent-service:3410
  AGENT_API_TOKEN: ${AGENT_INTERNAL_TOKEN:?run with EXTRA_SECRETS="agent mediator"}

  # mediator-1 is enough for minting invitations (both replicas share one store).
  MEDIATOR_ADMIN_URL: http://mediator-1:3000
  MEDIATOR_ADMIN_TOKEN: ${MEDIATOR_ADMIN_TOKEN:?decrypt secrets via deploy.sh}
  MEDIATOR_DRIZZLE_URL: postgresql://platform_ro:${PLATFORM_RO_PASSWORD:?decrypt secrets via deploy.sh}@postgres:5432/drizzle
  MEDIATOR_WEBHOOK_SECRET: ${MEDIATOR_WEBHOOK_SECRET:?decrypt secrets via deploy.sh}

  PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:?decrypt secrets via deploy.sh}
  # Phase 4 console scope; must equal console.sops.env's CONSOLE_TOKEN.
  CONSOLE_TOKEN: ${CONSOLE_TOKEN:?add CONSOLE_TOKEN to secrets/platform.sops.env}

  INDY_NAMESPACE: twelveid:staging
  GENESIS_URL: https://genesis.12id.naziharitsolution.com/v1/pool_transactions_genesis
  GENESIS_SHA256: 6ab9bc1a3ba5ff257454ca8500a41d45756cd02c3db6c280bde51c7b363a835a
  GENESIS_SIGNATURE_URL: https://genesis.12id.naziharitsolution.com/v1/pool_transactions_genesis.minisig
  # infra/staging/genesis-signing.pub, key id 169255404DD823AD (6-phase-1-findings W9).
  GENESIS_SIGNING_PUBLIC_KEY: ${GENESIS_SIGNING_PUBLIC_KEY:-RWStI9hNQFWSFkkkT1AbPYCeDpOk6zzSe3wCAdWYAdr/tbTIpkm9819Q}
  VDR_PROXY_URL: https://vdr.12id.naziharitsolution.com

  # Phase 6 biometric gate (compose.biometric.yml).
  BIOMETRIC_SERVICE_URL: http://biometric-service:3430
  BIOMETRIC_SERVICE_TOKEN: ${BIOMETRIC_INTERNAL_TOKEN:?run with EXTRA_SECRETS="agent mediator biometric"}

  DRAIN_DEADLINE_MS: "15000"

services:
  # One-shot: creates the platform_api database on the agent stack's Postgres and applies migrations.
  platform-provision:
    build: ../../services
    image: *image
    command: ['platform-api/src/provision.ts']
    environment: *platform-env
    mem_limit: 256m
    networks: [agent, mediator]

  platform-api:
    image: *image
    command: ['platform-api/src/main.ts']
    restart: unless-stopped
    mem_limit: 512m
    # Must exceed DRAIN_DEADLINE_MS plus shutdown time.
    stop_grace_period: 30s
    environment: *platform-env
    ports:
      - '127.0.0.1:3500:3500'
    networks: [agent, mediator, biometric]
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3500/readyz\").then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      platform-provision:
        condition: service_completed_successfully

networks:
  agent:
    external: true
    name: 12id-agent
  mediator:
    external: true
    name: 12id-mediator
  biometric:
    external: true
    name: 12id-biometric
