# Monitoring stack (W7): Prometheus, Alertmanager, Grafana and exporters.
#
#   infra/scripts/deploy.sh monitoring
#
# secrets/monitoring.sops.env: GRAFANA_ADMIN_PASSWORD, GMAIL_APP_PASSWORD (the alert mail account's
# SMTP password; optional, an empty file means alerts show in the UI only), ALERT_WEBHOOK_SECRET (the
# bearer secret of platform-api's POST /internal/alerts, which feeds the console's System health page;
# compose.platform.yml mounts the same file; optional, without it the page says monitoring is not
# connected and Alertmanager logs a refused notification every minute), MONITORING_DB_PASSWORD: the
# Postgres exporters connect as `monitoring_ro` (pg_monitor + SELECT on the tables their queries read;
# infra/scripts/pg-roles.sh), never as the superuser (Phase 7 H3).
#
# Phase 9 W2: secrets are files under /run/secrets, read natively (Grafana __FILE, the exporters'
# DATA_SOURCE_PASS_FILE, Alertmanager's smtp_auth_password_file). The environment's hostnames reach
# Prometheus and Alertmanager through `configs` below, which compose writes from infra/env/<env>.env.
# Third-party images come from release.env (third-party.images, implement/28 Q1.1), pinned by digest.
#
# Everything listens on 127.0.0.1: Docker-published ports bypass ufw. Reach Prometheus (:9090),
# Alertmanager (:9093) and, in production, Grafana (:3300) over an SSH tunnel; staging also serves
# Grafana through Caddy with its own login (infra/env/staging/caddy/staging.caddy).
name: monitoring

# Non-root secret readers: see compose.agent.yml.
x-secret-reader: &secret-reader
  group_add: ['${SECRETS_GID:?run through deploy.sh}']
  labels:
    io.12id.secrets-rev: ${SECRETS_REV:?run through deploy.sh}

# A private CA behind the edge (EDGE_CA_FILE, implement/28 Q1.2): blackbox probes the environment's own
# hostnames and Alertmanager may mail through an SMTP server with the same CA. Both are Go programs, which
# add every certificate in SSL_CERT_DIR to the system's; unset, the directory holds an empty /dev/null.
x-edge-ca: &edge-ca ${EDGE_CA_FILE:-/dev/null}:/etc/12id-ca/ca.pem:ro

x-exporter: &exporter
  image: ${POSTGRES_EXPORTER_IMAGE:?release.env}
  <<: *secret-reader
  restart: unless-stopped
  mem_limit: 64m
  secrets: [MONITORING_DB_PASSWORD]

x-exporter-env: &exporter-env
  DATA_SOURCE_USER: monitoring_ro
  DATA_SOURCE_PASS_FILE: /run/secrets/MONITORING_DB_PASSWORD
  PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?release.env}
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?env file}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=127.0.0.1:9090
      # ${ENVIRONMENT} in external_labels (prometheus.yml).
      - --enable-feature=expand-external-labels
    configs:
      - source: blackbox-http-targets
        target: /etc/prometheus/targets/blackbox-http.yml
      - source: indy-client-targets
        target: /etc/prometheus/targets/indy-client.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?release.env}
    <<: *secret-reader
    network_mode: host
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    configs:
      - source: alertmanager
        target: /etc/alertmanager/alertmanager.yml
    # Alertmanager reads the secret files itself (smtp_auth_password_file, credentials_file); no entrypoint trick.
    secrets: [GMAIL_APP_PASSWORD, ALERT_WEBHOOK_SECRET]
    environment:
      SSL_CERT_DIR: /etc/12id-ca
    volumes:
      - alertmanager-data:/alertmanager
      - *edge-ca

  grafana:
    image: ${GRAFANA_IMAGE:?release.env}
    <<: *secret-reader
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '3300'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3300}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/GRAFANA_ADMIN_PASSWORD
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    secrets: [GRAFANA_ADMIN_PASSWORD]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:?release.env}
    network_mode: host
    pid: host
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      # Textfile metrics, e.g. the ledger write probe (scripts/ledger-write-probe.sh).
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      # Created by deploy.sh (Docker would create it root-owned).
      - ${METRICS_DIR:?run through deploy.sh}:/textfile:ro

  cadvisor:
    image: ${CADVISOR_IMAGE:?release.env}
    network_mode: host
    restart: unless-stopped
    # 256m was too small: it sat at the cap, scrapes timed out (up ~7% of 12 h) and it burned CPU (2026-09-21).
    mem_limit: 512m
    # cAdvisor needs broad host access to read container cgroups; acceptable on a single-purpose VM.
    privileged: true
    devices:
      - /dev/kmsg
    command: ['--listen_ip=127.0.0.1', '--port=9101', '--docker_only=true', '--housekeeping_interval=30s']
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  blackbox:
    image: ${BLACKBOX_IMAGE:?release.env}
    network_mode: host
    restart: unless-stopped
    mem_limit: 64m
    command: ['--config.file=/etc/blackbox/blackbox.yml', '--web.listen-address=127.0.0.1:9115']
    environment:
      SSL_CERT_DIR: /etc/12id-ca
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - *edge-ca

  # Mediator pickup-queue metrics from the message_pickup database.
  postgres-exporter:
    <<: *exporter
    environment:
      <<: *exporter-env
      DATA_SOURCE_URI: postgres:5432/message_pickup?sslmode=disable
    volumes:
      - ./monitoring/postgres-exporter-queries.yml:/etc/postgres-exporter/queries.yml:ro
    ports:
      - '127.0.0.1:9187:9187'
    networks:
      - mediator

  # Mediation-record metrics from the drizzle database (open-mediation abuse signal).
  postgres-exporter-drizzle:
    <<: *exporter
    environment:
      <<: *exporter-env
      DATA_SOURCE_URI: postgres:5432/drizzle?sslmode=disable
    volumes:
      - ./monitoring/postgres-exporter-drizzle-queries.yml:/etc/postgres-exporter/queries.yml:ro
    ports:
      - '127.0.0.1:9188:9187'
    networks:
      - mediator

  # Phase 7 review M16: agent-service outbox lag (the platform consumer's backlog).
  postgres-exporter-agent:
    <<: *exporter
    environment:
      <<: *exporter-env
      DATA_SOURCE_URI: agent-postgres:5432/agent_service?sslmode=disable
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: 'true'
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: 'true'
    volumes:
      - ./monitoring/postgres-exporter-agent-queries.yml:/etc/postgres-exporter/queries.yml:ro
    ports:
      - '127.0.0.1:9190:9187'
    networks:
      - agent

  # Phase 7 review M16: endorser decisions (refusals, and how close a tenant is to the daily ceiling).
  postgres-exporter-endorser:
    <<: *exporter
    environment:
      <<: *exporter-env
      DATA_SOURCE_URI: agent-postgres:5432/endorser_service?sslmode=disable
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: 'true'
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: 'true'
    volumes:
      - ./monitoring/postgres-exporter-endorser-queries.yml:/etc/postgres-exporter/queries.yml:ro
    ports:
      - '127.0.0.1:9191:9187'
    networks:
      - agent

  # Phase 6 biometric gate metrics from platform-api's biometric log (agent-postgres).
  postgres-exporter-biometric:
    <<: *exporter
    environment:
      <<: *exporter-env
      DATA_SOURCE_URI: agent-postgres:5432/platform_api?sslmode=disable
      # Only the custom biometric series; the mediator exporters already report Postgres itself.
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: 'true'
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: 'true'
    volumes:
      - ./monitoring/postgres-exporter-biometric-queries.yml:/etc/postgres-exporter/queries.yml:ro
    ports:
      - '127.0.0.1:9189:9187'
    networks:
      - agent

configs:
  # Public HTTPS endpoints, through Caddy (prometheus.yml job blackbox-http).
  blackbox-http-targets:
    content: |
      - targets:
          - https://${GENESIS_HOST:?env file}/${GENESIS_VERSION:?env file}/pool_transactions_genesis
          # Answers 202, which http_2xx accepts.
          - https://${MEDIATOR_HOST:?env file}/health
          - https://${VDR_HOST:?env file}/genesis
          # Phase 2 agent-service readiness (503 while draining or when its database is down).
          - https://${AGENT_HOST:?env file}/readyz
          - https://${API_HOST:?env file}/v1/health
          # Phase 4 console liveness.
          - https://${CONSOLE_HOST:?env file}/api/health

  # The validators' client ports as the genesis advertises them. Our own network: the four ports on PUBLIC_IP.
  # An existing network: LEDGER_CLIENT_TARGETS, comma-separated host:port (init.sh writes it from the genesis).
  indy-client-targets:
    content: |
      - targets: [${LEDGER_CLIENT_TARGETS:-${PUBLIC_IP:?env file}:9702, ${PUBLIC_IP}:9704, ${PUBLIC_IP}:9706, ${PUBLIC_IP}:9708}]

  alertmanager:
    content: |
      global:
        smtp_smarthost: ${ALERT_SMTP_SMARTHOST:?env file}
        smtp_from: ${ALERT_SMTP_FROM:?env file}
        smtp_auth_username: ${ALERT_SMTP_USERNAME:?env file}
        # GMAIL_APP_PASSWORD in secrets/monitoring.sops.env. Empty: alerts show in the UI only and
        # mail delivery fails.
        smtp_auth_password_file: /run/secrets/GMAIL_APP_PASSWORD
        smtp_require_tls: true

      route:
        receiver: email
        group_by: [alertname]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 12h
        routes:
          # The heartbeat goes to the console only, every five minutes, and stops here: no mail.
          - matchers: [alertname = Watchdog]
            receiver: console
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 5m
          # Every other alert goes to the console (repeated hourly while it fires, so the console can
          # tell an alert that is still firing from one whose resolve it missed) ...
          - receiver: console
            group_wait: 30s
            group_interval: 1m
            repeat_interval: 1h
            continue: true
          # ... and then by mail, with the timing above, as before.
          - receiver: email

      receivers:
        - name: email
          email_configs:
            - to: ${ALERT_EMAIL_TO:?env file}
              send_resolved: true
        # platform-api keeps what is sent here for the console's System health page
        # (implement/22-console-feedback.md C16). Alertmanager runs on the host network and
        # platform-api publishes 3500 on 127.0.0.1; the edge answers 404 for /internal/*.
        - name: console
          webhook_configs:
            - url: http://127.0.0.1:3500/internal/alerts
              send_resolved: true
              http_config:
                authorization:
                  type: Bearer
                  credentials_file: /run/secrets/ALERT_WEBHOOK_SECRET

secrets:
  GRAFANA_ADMIN_PASSWORD:
    file: ${RUN_SECRETS:?run through deploy.sh}/monitoring/GRAFANA_ADMIN_PASSWORD
  GMAIL_APP_PASSWORD:
    file: ${RUN_SECRETS}/monitoring/GMAIL_APP_PASSWORD
  ALERT_WEBHOOK_SECRET:
    file: ${RUN_SECRETS}/monitoring/ALERT_WEBHOOK_SECRET
  MONITORING_DB_PASSWORD:
    file: ${RUN_SECRETS}/monitoring/MONITORING_DB_PASSWORD

networks:
  mediator:
    external: true
    name: 12id-mediator
  agent:
    external: true
    name: 12id-agent

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
