# Production ledger (Phase 9 W2, owner decision 2026-09-28): our own Indy network of 4 validators from
# the official indy-node-container image, all on the app VM for now (18-phase-9-production.md). Not used
# on staging, which keeps von-network (17-phase-7.md L16).
#
#   infra/scripts/deploy.sh ledger-nodes run --rm ceremony   # once, before the first start (runbooks/ledger-ceremony.md)
#   infra/scripts/deploy.sh ledger-nodes                     # then: up -d
#
# Networking (replaces staging's hairpin and DOCKER-USER rules, 6-phase-1-findings W1):
#   - node_ip: each validator has a fixed address on the private 12id-ledger network, and that address
#     is what the genesis advertises for validator-to-validator traffic. Node ports are never published.
#   - client_ip: the VM's public IP (PUBLIC_IP) in the genesis; the client ports 9702/9704/9706/9708
#     are published on all interfaces on purpose, because phones read the ledger there.
# The addresses and ports below are written into the genesis by the ceremony (compose.ledger.yml);
# changing them later is a NODE transaction per validator plus a new genesis version
# (runbooks/genesis-rotation.md).
#
# Keys: the ceremony writes each validator's node and BLS keys into that validator's volume and
# nowhere else. There are no seeds in any environment variable (INDY_NODE_SEED stays unset, and the
# image only generates keys when the volume has none, which the ceremony prevents).
name: ledger-nodes

x-node: &node
  # The upstream project publishes only moving `-main` tags, so the digest is the version (1.13.2, Debian 12).
  image: ghcr.io/hyperledger-indy/indy-node-container/indy_node:1.13.2-debian12-main@sha256:d1f7d24fda5cfd1e20eed657a3deefe051280336c86a261070b9219a61c42ebe
  restart: unless-stopped
  # tini as PID 1, so the healthcheck below can end a hung node and the restart policy brings it back.
  init: true
  # A validator that hangs at start ("Starting ledger…") never opens its client port, and nothing restarted
  # it: on staging two of four hung for 21 h and writes stopped (19-phase-9-production-findings W2).
  # Three failed checks in a row (after the start period, which covers a catch-up) end PID 1. The
  # failure count lives on a tmpfs, so a restarted node starts from zero (the vdr-proxy pattern).
  tmpfs: [/healthstate]
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        if python3 -c 'import os, socket; socket.create_connection(("127.0.0.1", int(os.environ["INDY_CLIENT_PORT"])), 5).close()';
        then rm -f /healthstate/failures; exit 0; fi;
        n=$$(( $$(cat /healthstate/failures 2>/dev/null || echo 0) + 1 )); echo $$n > /healthstate/failures;
        [ $$n -ge 3 ] && kill 1; exit 1
    interval: 60s
    timeout: 15s
    retries: 3
    start_period: 300s
  mem_limit: 1g
  stop_grace_period: 30s
  # Our configuration over the image's (stdout logging), then the image's own init script.
  entrypoint: ['/bin/sh', '-c', 'cp /etc/12id/indy_config.py /etc/indy/indy_config.py && exec ./init_and_run.sh']
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: '5'

x-node-env: &node-env
  INDY_NETWORK_NAME: ${LEDGER_NETWORK_NAME:?env file}
  # Bind addresses inside the container; the genesis carries the advertised ones.
  INDY_NODE_IP: 0.0.0.0
  INDY_CLIENT_IP: 0.0.0.0
  # No controller container (it needs the Docker socket); upgrades are a new image digest here.
  CONTROLLER_CONTAINER_NAME: none

services:
  # Genesis ceremony (infra/ledger/ceremony/ceremony.py), profile only: never started by `up`. Node keys go
  # into the validators' volumes below; trustee and steward seeds only leave as age files for offline
  # custody. No network at all. It refuses to run over an existing network.
  ceremony:
    image: ${REGISTRY:?release.env}/12id-ledger-ceremony:${VERSION:?release.env}@${LEDGER_CEREMONY_DIGEST:?release.env}
    profiles: [ceremony]
    network_mode: none
    environment:
      NETWORK_NAME: ${LEDGER_NETWORK_NAME:?env file}
      NODE_COUNT: '4'
      # The fixed addresses below, on 12id-ledger.
      NODE_IPS: 192.168.97.11,192.168.97.12,192.168.97.13,192.168.97.14
      # What phones and agents connect to: the public IP, unless the env file lists one per validator.
      CLIENT_IPS: ${LEDGER_CLIENT_IPS:-${PUBLIC_IP:?env file}}
      PORT_BASE: '9701'
      TRUSTEE_COUNT: ${LEDGER_TRUSTEE_COUNT:-3}
    volumes:
      - node1-data:/nodes/node1
      - node2-data:/nodes/node2
      - node3-data:/nodes/node3
      - node4-data:/nodes/node4
      # Public outputs (genesis, CSVs) and custody/*.seed.age; must be empty.
      - ${CEREMONY_OUT:-/opt/12id/ceremony/out}:/out
      # default.txt: the offline age recipients (one per line); trustee-2.txt etc. to split custody.
      - ${CUSTODY_RECIPIENTS:-/opt/12id/ceremony/recipients}:/custody-recipients:ro

  node1:
    <<: *node
    environment:
      <<: *node-env
      INDY_NODE_NAME: Node1
      INDY_NODE_PORT: '9701'
      INDY_CLIENT_PORT: '9702'
    ports: ['${LEDGER_CLIENT_BIND:-0.0.0.0}:9702:9702']
    volumes:
      - ./ledger/indy_config.py:/etc/12id/indy_config.py:ro
      - node1-data:/var/lib/indy
      - node1-log:/var/log/indy
    networks:
      ledger:
        ipv4_address: 192.168.97.11

  node2:
    <<: *node
    environment:
      <<: *node-env
      INDY_NODE_NAME: Node2
      INDY_NODE_PORT: '9703'
      INDY_CLIENT_PORT: '9704'
    ports: ['${LEDGER_CLIENT_BIND:-0.0.0.0}:9704:9704']
    volumes:
      - ./ledger/indy_config.py:/etc/12id/indy_config.py:ro
      - node2-data:/var/lib/indy
      - node2-log:/var/log/indy
    networks:
      ledger:
        ipv4_address: 192.168.97.12

  node3:
    <<: *node
    environment:
      <<: *node-env
      INDY_NODE_NAME: Node3
      INDY_NODE_PORT: '9705'
      INDY_CLIENT_PORT: '9706'
    ports: ['${LEDGER_CLIENT_BIND:-0.0.0.0}:9706:9706']
    volumes:
      - ./ledger/indy_config.py:/etc/12id/indy_config.py:ro
      - node3-data:/var/lib/indy
      - node3-log:/var/log/indy
    networks:
      ledger:
        ipv4_address: 192.168.97.13

  node4:
    <<: *node
    environment:
      <<: *node-env
      INDY_NODE_NAME: Node4
      INDY_NODE_PORT: '9707'
      INDY_CLIENT_PORT: '9708'
    ports: ['${LEDGER_CLIENT_BIND:-0.0.0.0}:9708:9708']
    volumes:
      - ./ledger/indy_config.py:/etc/12id/indy_config.py:ro
      - node4-data:/var/lib/indy
      - node4-log:/var/log/indy
    networks:
      ledger:
        ipv4_address: 192.168.97.14

networks:
  ledger:
    name: 12id-ledger
    ipam:
      config:
        - subnet: 192.168.97.0/24

# Named, so backups and drills find them. The data volumes hold the ledger and the node keys: they are
# backed up (backup-postgres.sh) and are part of the DR drill.
volumes:
  node1-data:
    name: 12id-ledger-node1-data
  node2-data:
    name: 12id-ledger-node2-data
  node3-data:
    name: 12id-ledger-node3-data
  node4-data:
    name: 12id-ledger-node4-data
  node1-log:
  node2-log:
  node3-log:
  node4-log:
