# Biometric stack (Phase 6 B6, implement/15-phase-6-biometric.md): biometric-provision (init job) +
# biometric-service.
#
#   infra/scripts/deploy.sh biometric
#
# secrets/biometric.sops.env: BIOMETRIC_MASTER_KEY (32 random bytes, base64), BIOMETRIC_INTERNAL_TOKEN
# (platform-api presents it; the same value goes into platform.sops.env), BIOMETRIC_AWS_ACCESS_KEY_ID /
# BIOMETRIC_AWS_SECRET_ACCESS_KEY (12id's own AWS principal, which assumes each tenant's role; see
# runbooks/biometric-service.md; optional: an empty file leaves them unset), BIOMETRIC_DB_PASSWORD (the
# `biometric` role, infra/scripts/pg-roles.sh). Phase 9 W2: all of them are files under /run/secrets.
#
# Database: `biometric` on the agent stack's Postgres (owner decision, 15-phase-6-biometric.md), owned
# by its own non-superuser role since Phase 7 H3. Backed up with the other agent databases.
#
# Networks: `12id-agent` for agent-postgres, `12id-biometric` (created here) shared with platform-api
# only. Nothing is published on the host; the service needs outbound HTTPS to AWS.
#
# Deploy this stack before the platform stack: platform-api joins 12id-biometric.
name: biometric

x-image: &image ${REGISTRY:?release.env}/12id-services:${VERSION:?release.env}@${SERVICES_DIGEST:?release.env}

# Non-root secret readers: see compose.agent.yml.
x-secret-reader: &secret-reader
  group_add: ['${SECRETS_GID:?run through deploy.sh}']
  labels:
    io.12id.secrets-rev: ${SECRETS_REV:?run through deploy.sh}

x-biometric-env: &biometric-env
  LOG_LEVEL: ${BIOMETRIC_LOG_LEVEL:-info}
  HOST: 0.0.0.0
  PORT: "3430"
  DATABASE_URL: postgresql://biometric@agent-postgres:5432/biometric
  DATABASE_URL_PASSWORD_FILE: /run/secrets/BIOMETRIC_DB_PASSWORD
  BIOMETRIC_MASTER_KEY_FILE: /run/secrets/BIOMETRIC_MASTER_KEY
  INTERNAL_TOKEN_FILE: /run/secrets/BIOMETRIC_INTERNAL_TOKEN
  BIOMETRIC_AWS_ACCESS_KEY_ID_FILE: /run/secrets/BIOMETRIC_AWS_ACCESS_KEY_ID
  BIOMETRIC_AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/BIOMETRIC_AWS_SECRET_ACCESS_KEY
  BIOMETRIC_AWS_REGION: ${BIOMETRIC_AWS_REGION:?env file}
  # Staging only: smokes and the console spec use the mock provider. Never true in production.
  BIOMETRIC_ENABLE_MOCK: ${BIOMETRIC_ENABLE_MOCK:-false}

x-biometric-secrets: &biometric-secrets
  - BIOMETRIC_DB_PASSWORD
  - BIOMETRIC_MASTER_KEY
  - BIOMETRIC_INTERNAL_TOKEN
  - BIOMETRIC_AWS_ACCESS_KEY_ID
  - BIOMETRIC_AWS_SECRET_ACCESS_KEY

services:
  # One-shot: creates the biometric database on agent-postgres and applies migrations.
  biometric-provision:
    image: *image
    <<: *secret-reader
    command: ['biometric-service/src/provision.ts']
    environment: *biometric-env
    secrets: *biometric-secrets
    mem_limit: 256m
    networks: [agent]

  biometric-service:
    image: *image
    <<: *secret-reader
    command: ['biometric-service/src/main.ts']
    restart: unless-stopped
    mem_limit: 384m
    stop_grace_period: 20s
    environment: *biometric-env
    secrets: *biometric-secrets
    networks: [agent, biometric]
    # Host-local only, for the blackbox probe of /healthz (every other route needs the token).
    ports:
      - '127.0.0.1:3430:3430'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3430/healthz\").then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      biometric-provision:
        condition: service_completed_successfully

secrets:
  BIOMETRIC_DB_PASSWORD:
    file: ${RUN_SECRETS:?run through deploy.sh}/biometric/BIOMETRIC_DB_PASSWORD
  BIOMETRIC_MASTER_KEY:
    file: ${RUN_SECRETS}/biometric/BIOMETRIC_MASTER_KEY
  BIOMETRIC_INTERNAL_TOKEN:
    file: ${RUN_SECRETS}/biometric/BIOMETRIC_INTERNAL_TOKEN
  BIOMETRIC_AWS_ACCESS_KEY_ID:
    file: ${RUN_SECRETS}/biometric/BIOMETRIC_AWS_ACCESS_KEY_ID
  BIOMETRIC_AWS_SECRET_ACCESS_KEY:
    file: ${RUN_SECRETS}/biometric/BIOMETRIC_AWS_SECRET_ACCESS_KEY

networks:
  agent:
    external: true
    name: 12id-agent
  biometric:
    name: 12id-biometric
