# com.12id:holder-sdk-android and the biometric add-ons (Phase 9 W3, 5b.2/5b.3), on the tag
# sdk-android-vX (X = sdkVersion in sdk-android/gradle.properties): tests, apiCheck, the sample built the
# way a customer builds it (native libraries from maven.12id.com), then publish and a GitHub release with
# the API dump. The emulator matrix belongs to the native libraries (release-native.yml).
name: release-sdk-android

on:
  push:
    tags: ['sdk-android-v*']

permissions:
  contents: write # the GitHub release

concurrency:
  group: release-sdk-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The tag must point at master and match sdkVersion
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          want="$(sed -n 's/^sdkVersion=//p' sdk-android/gradle.properties)"
          [ "${GITHUB_REF_NAME#sdk-android-v}" = "$want" ] || { echo "tag $GITHUB_REF_NAME, sdkVersion $want" >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nazihar/12id-maven
          token: ${{ secrets.MAVEN_REPO_TOKEN }}
          path: maven-repo
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Tests and API check
        working-directory: sdk-android
        run: bash ./gradlew --console=plain :ariesframework:testReleaseUnitTest :sdk:testReleaseUnitTest :sdk:apiCheck
      - name: The sample builds from published artifacts, as a customer app would
        working-directory: sdk-android
        run: bash ./gradlew --console=plain :sample:assembleDebug :sample:assembleRelease
      - name: Publish into the public repository
        run: |
          v="${GITHUB_REF_NAME#sdk-android-v}"
          for a in holder-sdk-android holder-sdk-android-biometrics-aws holder-sdk-android-biometrics-mock; do
            bash sdk-android/ci/maven-repo.sh assert-new maven-repo "$a" "$v"
          done
          (cd sdk-android && bash ./gradlew --console=plain -PpublishRepo="$GITHUB_WORKSPACE/maven-repo" \
            :sdk:publishReleasePublicationToLocalRepository \
            :biometrics-aws:publishReleasePublicationToLocalRepository \
            :biometrics-mock:publishReleasePublicationToLocalRepository)
          bash sdk-android/ci/maven-repo.sh push maven-repo "com.12id:holder-sdk-android:$v (and the biometric add-ons)"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "com.12id:holder-sdk-android:${GITHUB_REF_NAME#sdk-android-v} on https://maven.12id.com (sdk-android/docs/integration.md). API dump attached." \
            sdk-android/sdk/api/sdk.api
