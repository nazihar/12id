# Checks for sdk-android/ (Phase 9 W3, 5b.3): build, the fork's and the SDK's JVM tests, and apiCheck
# (sdk/api/sdk.api). The native libraries are not rebuilt here (release-native.yml), and the emulator
# matrix runs on releases and by hand (release-sdk-android.yml), to keep within the free Actions minutes.
name: ci-sdk-android

on:
  push:
    branches: [master]
    paths: ['sdk-android/**', '.github/workflows/ci-sdk-android.yml']
  pull_request:
    paths: ['sdk-android/**', '.github/workflows/ci-sdk-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - run: bash ./gradlew --console=plain :ariesframework:testReleaseUnitTest :sdk:testReleaseUnitTest :sdk:apiCheck :sdk:assembleRelease :biometrics-mock:assembleRelease :biometrics-aws:assembleRelease
