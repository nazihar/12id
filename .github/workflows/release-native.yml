# com.12id:holder-sdk-native (Phase 9 W3, 5b.1): rebuilds the UniFFI wrappers (sdk-android/native/build.sh),
# runs the load test on x86_64 emulators at API 24/26/28/36, then publishes to maven.12id.com.
#   native-vX   (X = nativeVersion in sdk-android/gradle.properties) build, test, publish, GitHub release
#   by hand     build and test only
name: release-native

on:
  push:
    tags: ['native-v*']
  workflow_dispatch:

permissions:
  contents: write # the GitHub release

concurrency:
  group: release-native
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The tag must point at master and match nativeVersion
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          want="$(sed -n 's/^nativeVersion=//p' sdk-android/gradle.properties)"
          [ "${GITHUB_REF_NAME#native-v}" = "$want" ] || { echo "tag $GITHUB_REF_NAME, nativeVersion $want" >&2; exit 1; }
      - name: NDK and cargo-ndk
        run: |
          . sdk-android/native/versions.env
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_REVISION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_REVISION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build
        run: NATIVE_WORK="$RUNNER_TEMP/native-work" bash sdk-android/native/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jniLibs
          path: sdk-android/native/jniLibs
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [24, 26, 28, 36]
    steps:
      # API 36's image needs ~7.2 GB for userdata; the runner had 7.3 GB free and the emulator refused to start
      # (2026-10-01). Drop preinstalled toolchains this job never uses. First, and never the tool cache:
      # setup-java installs the JDK there.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jniLibs
          path: sdk-android/native/jniLibs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Private-repo runners have 2 vCPUs and ~7 GB RAM; API 36 boots slowly there (2026-10-01).
          emulator-boot-timeout: 900
          ram-size: 3072M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: sdk-android
          script: bash ./gradlew --console=plain :native:connectedDebugAndroidTest

  publish:
    needs: emulator
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jniLibs
          path: sdk-android/native/jniLibs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nazihar/maven
          token: ${{ secrets.MAVEN_REPO_TOKEN }}
          path: maven-repo
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Publish into the public repository
        run: |
          v="${GITHUB_REF_NAME#native-v}"
          bash sdk-android/ci/maven-repo.sh assert-new maven-repo holder-sdk-native "$v"
          (cd sdk-android && bash ./gradlew --console=plain :native:publishReleasePublicationToLocalRepository -PpublishRepo="$GITHUB_WORKSPACE/maven-repo")
          bash sdk-android/ci/maven-repo.sh push maven-repo "com.12id:holder-sdk-native:$v"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "com.12id:holder-sdk-native:${GITHUB_REF_NAME#native-v} on https://maven.12id.com (sdk-android/native/README.md)." \
            sdk-android/native/jniLibs/SHA256SUMS
