# Checks for console/ (Phase 9 W3, 5b.3): typecheck, Vitest, a production build with the client-bundle
# check (no server code in the browser), and npm audit. Playwright e2e stays local/staging.
name: ci-console

on:
  push:
    branches: [master]
    paths: ['console/**', 'services/platform-api/openapi.console.json', '.github/workflows/ci-console.yml']
  pull_request:
    paths: ['console/**', 'services/platform-api/openapi.console.json', '.github/workflows/ci-console.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:client
      - run: npm audit --audit-level=high
