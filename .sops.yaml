# SOPS encryption rules for 12id (Phase 1 W9; Phase 9 W2 layout and second recipient).
#
# Each environment's secrets are encrypted to two recipients:
#   - the VM's age key (/opt/12id/secrets/age.key on that VM), which deploy.sh uses;
#   - the environment's offline key (infra/env/<env>/backup-recipients.txt), kept offline by the owner,
#     so the secrets (and the backups) can be recovered when the VM and its key are both lost (M13).
# After changing a list, run `sops updatekeys -y <file>` on each file, on the VM (it can decrypt them).
creation_rules:
  - path_regex: infra/env/staging/secrets/.*\.sops\.(env|yaml|json)$
    age: age13wc3chpmnf98wm0t8599km70n6xhcg2kzw4rgzdcz9ujfg64hs2stj2t2v,age10yjjvjjafjllprv3xwzxjmnqerxnp8uv5lh6pvfkqam0s2gzzc4qv6junc
  # Production (W5): the production VM's key and the production offline key, added at bring-up.
