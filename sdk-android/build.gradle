// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    // 12id: toolchain moved from AGP 8.0.2 / Kotlin 1.8.0 for compileSdk 36 (Phase 5 A0).
    // AGP 9 is a larger DSL change and is left for a later bump.
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
    // Declared once here so every module shares one Kotlin plugin classloader.
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
    // Guards the SDK's public API (Phase 5 plan S): `apiDump` writes sdk/api/sdk.api, `apiCheck` fails on drift.
    id 'org.jetbrains.kotlinx.binary-compatibility-validator' version '0.18.2'
}

apiValidation {
    // Only the customer-facing SDK has a stable API; the fork and the sample are internal.
    ignoredProjects += ['ariesframework', 'sample']
}