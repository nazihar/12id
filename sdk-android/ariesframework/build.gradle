plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id "org.jlleitschuh.gradle.ktlint" version '13.1.0'
}

android {
    namespace 'org.hyperledger.ariesframework'
    compileSdk 36

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // 12id fork change (W3): the vendored java-multibase, as in :sdk (third_party/java-multibase).
    sourceSets {
        main.java.srcDirs += ['../third_party/java-multibase/java']
    }
}

// 12id: Kotlin 2.x refuses the old kotlinOptions block; keep the JVM target equal to compileOptions.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

ktlint {
    version = "0.49.1"
    reporters {
        reporter "checkstyle"
    }
}

dependencies {
    // 12id fork change (W3): the rebuilt UniFFI wrappers (native/README.md).
    implementation project(':native')

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.0'
    implementation 'org.slf4j:slf4j-api:1.7.32'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.4.0'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation('org.didcommx:peerdid:0.5.0') { exclude group: 'com.github.multiformats' }

    // 12id fork change (W3): androidx core/appcompat and Material dropped; the framework uses none of them.
    // 12id fork change: a library must not choose the app's logging backend; logback is for tests only.
    testImplementation 'ch.qos.logback:logback-classic:1.2.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.0'
    androidTestImplementation 'ch.qos.logback:logback-classic:1.2.6'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.0'
}

// 12id fork change (W3): not published on its own; its sources compile into :sdk (com.12id:holder-sdk-android).
