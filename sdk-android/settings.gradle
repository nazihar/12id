pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // The published SDK, native libraries and add-ons (`./gradlew publishAllPublicationsToLocalRepository`);
        // the sample consumes them from here like a customer app would (Phase 5 plan P). CI copies this
        // directory into the public repository (Phase 9 W3).
        maven {
            name = "local"
            url = uri("build/m2")
            content { includeGroup("com.12id") }
        }
        // The public repository (GitHub Pages, nazihar/maven): whatever was not published locally, usually
        // com.12id:holder-sdk-native, which only native/build.sh on a Linux host can produce.
        maven {
            name = "12id"
            url = uri("https://maven.12id.com")
            content { includeGroup("com.12id") }
        }
    }
}

rootProject.name = "12id-sdk-android"
include ':native'
include ':ariesframework'
include ':sdk'
include ':biometrics-mock'
include ':biometrics-aws'
include ':sample'
